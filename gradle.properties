# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# KSP (Room compiler) registers its generated sources via the kotlin.sourceSets
# DSL, which AGP 9 built-in Kotlin rejects by default. This is the documented
# escape hatch: https://developer.android.com/r/tools/built-in-kotlin
android.disallowKotlinSourceSets=false
